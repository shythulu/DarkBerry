# Cloudberry Wisp for starship. Cloudberry tint of Wisp: light, neutrals leaned toward cloudberry (base #fff4ee).
#
# Generated by build.mjs from src/ports/starship.toml. Do not edit ports/starship/.
# Install with:  cp cloudberry-wisp.toml ~/.config/starship.toml
#
# A two-line box-drawing prompt. Row one is where you are, with a rule pushing
# toolchain versions to the right margin; row two is the caret, with what just
# happened opposite it. The frame is plain Unicode box drawing, so it survives
# without a Nerd Font -- only the module icons need one.
#
# The palette below is split deliberately. Entries named after a ROLE take their
# colour from src/roles.json, so a module that means "this failed" follows
# ui.error wherever that points. Entries named after a PALETTE COLOUR are for
# things no role describes: a language's brand colour, or a git state that only
# needs to be distinguishable. Reach for a role first -- the caret is a cursor,
# not a success report, and colouring it with ui.success is how it ended up
# green by mistake.

"$schema" = 'https://starship.rs/config-schema.json'

# ═══════════════════════════════════════════════════════════════════════════
#  reed (two-line) -- box-drawing frame, full-width, Darkberry
# ═══════════════════════════════════════════════════════════════════════════
#  A drawn bracket down the left margin: ╭─ opens, ├─ continues, ╰─ closes on
#  the caret. Each scrollback entry becomes a visually bounded block, which is
#  what earns the extra lines -- scroll back through a long session and you can
#  see where one command's output stops and the next begins without reading it.
#
#  Row 1 -- WHERE YOU ARE:  machine, path, branch, working tree, then a ──
#           rule ($fill) pushing the toolchain versions to the right margin.
#  Row 2 -- the caret, with WHAT JUST HAPPENED opposite it on the right margin:
#           duration, exit status, background jobs, clock.
#
#  Two lines rather than three. The cost is the '├─' connector, which is gone:
#  a middle row needs content on every prompt to avoid rendering as a bare stub,
#  and moving that content to the right margin removes the reason for the row.
#  The frame now opens and closes, without continuing.
#
#  zsh drops RPROMPT silently when the line gets tight, so on a narrow terminal
#  the status disappears rather than wrapping. Everything there is recoverable
#  ($? and jobs), which is why it is the half that was moved.
#
#  Box-drawing characters (U+2500 U+2502 U+251C U+256D U+2570) are plain
#  Unicode, not Nerd Font -- kitty and Ghostty draw them natively, so the frame
#  survives with no Nerd Font at all. Only the module icons need one.
#
#  Costs the most vertical space of the four, and the $fill rule means the
#  prompt always spans the full terminal width: deliberate at 100+ columns,
#  cramped under about 70.
# ═══════════════════════════════════════════════════════════════════════════

format = """
[╭─](frame)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
[ ](frame)$fill[ ](frame)\
$rust\
$nodejs\
$python\
$line_break\
[╰─ ](frame)$character"""

# What just happened, pinned to the right margin of the caret line. zsh puts
# RPROMPT on the last line of a multi-line prompt, which is where the caret is,
# so the frame closes on the left and the status sits opposite it.
right_format = """
$cmd_duration\
$status\
$jobs\
$time"""

add_newline = true
command_timeout = 1000
palette = 'darkberry'

# The rule that spans to the right margin.
[fill]
symbol = "─"
style = "rule"

# ---- row one: where you are ------------------------------------------------

[os]
disabled = false
style = "berry"
format = '[ $symbol]($style)'

[os.symbols]
Macos       = "󰀵"
Arch        = "󰣇"
EndeavourOS = "󰣇"
Fedora      = "󰣛"
Windows     = "󰍲"
Ubuntu      = "󰕈"
Debian      = "󰣚"
Linux       = "󰌽"

[username]
show_always = false
style_user = "berry"
style_root = "bold error"
format = '[ $user]($style)'

[hostname]
ssh_only = true
style = "plum"
format = '[ 󰒋 $hostname]($style)'

[directory]
style = "berry"
format = '[ $path]($style)[$read_only]($read_only_style)'
read_only = " 󰌾"
read_only_style = "error"
truncation_length = 5
truncation_symbol = "…/"
truncate_to_repo = true
repo_root_style = "bold berry"
before_repo_root_style = "text_subtle"
repo_root_format = '[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music"     = "󰝚"
"Pictures"  = ""
"Developer" = "󰲋"
"dev"       = "󰲋"

[git_branch]
symbol = ""
style = "lavender"
format = ' [$symbol $branch]($style)'
truncation_length = 28
truncation_symbol = "…"

[git_status]
style = "honey"
conflicted = "[=$count](bold error)"
ahead      = "[⇡$count](success)"
behind     = "[⇣$count](apricot)"
diverged   = "[⇕$ahead_count/$behind_count](plum)"
untracked  = "[?$count](text_subtle)"
stashed    = "[󰏗$count](frost)"
modified   = "[!$count](warning)"
staged     = "[+$count](success)"
renamed    = "[»$count](lavender)"
deleted    = "[✘$count](bold error)"
format = '([ $all_status$ahead_behind]($style))'

[git_state]
style = "bold error"
format = ' [$state $progress_current/$progress_total]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "text_subtle"
format = '[ 󰅐 $time]($style)'

# ---- the right margin: what just happened ----------------------------------
# These render into right_format. $time is kept so the margin is never empty,
# which reads better than a caret line that is sometimes bare and sometimes not.

[rust]
symbol = ""
style = "apricot"
format = '[$symbol $version ]($style)'

[nodejs]
symbol = ""
style = "gooseberry"
format = '[$symbol $version ]($style)'
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = []

[python]
symbol = ""
style = "honey"
format = '[$symbol$version( $virtualenv) ]($style)'

[cmd_duration]
min_time = 2000
style = "apricot"
format = '[ 󰔟 $duration]($style)'
show_notifications = false

[status]
disabled = false
style = "bold error"
symbol = "✘"
not_found_symbol = "󰍉"
sigint_symbol = "󰜺"
signal_symbol = "⚡"
map_symbol = true
format = '[ $symbol $status]($style)'

[jobs]
symbol = "󰜎"
number_threshold = 1
style = "info"
format = '[ $symbol$number]($style)'

# ---- row three -------------------------------------------------------------

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold cursor)'   # ui.cursor is petal; the caret is a cursor, not a success report
error_symbol   = '[❯](bold error)'
vimcmd_symbol  = '[❮](bold plum)'

# ---- off -------------------------------------------------------------------
[package]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true

[palettes.darkberry]
# Roles: meaning. Change these in src/roles.json, not here.
cursor      = "#a63676"
success     = "#2c6f2d"
warning     = "#815b02"
error       = "#bb262a"
info        = "#006f5f"
text_subtle = "#9b7f70"
frame       = "#9b7f70"
rule        = "#c4aea2"

# Palette colours: no role carries these meanings.
berry      = "#bf0b64"
plum       = "#8c3eb2"
lavender   = "#6e52ab"
apricot    = "#a24712"
frost      = "#026b80"
gooseberry = "#2c6f2d"
honey      = "#815b02"
