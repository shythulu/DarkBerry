# Darkberry Fen for lsd. Soft dark. The background (#4c3342) is within a shade of the paint colour.
#
# Generated by build.mjs from src/ports/lsd.yaml. Do not edit ports/lsd/.
# Install with:  cp darkberry-fen.yaml ~/.config/lsd/colors.yaml
# and set  color: {theme: custom}  in ~/.config/lsd/config.yaml.
#
# Needs lsd 1.1 or newer: older releases reject hex strings and then drop the whole
# theme silently (Ubuntu 24.04 ships 1.0.0). For those, darkberry-fen.256.yaml beside this
# file carries the same theme as xterm-256 indices.
#
# Verified against lsd 1.2.0. Two things about that version are worth knowing:
# the theme struct is deny_unknown_fields, and `file-type` is skipped, so a
# `file-type:` key -- which plenty of lsd themes carry -- makes lsd discard the
# whole theme and fall back to stock defaults without printing an error. Every
# key below is one lsd 1.2.0 accepts. Keys left out simply keep their defaults.
#
# Because `file-type` is skipped, this file reaches only the metadata columns.
# File and folder names -- nearly everything a listing shows -- keep lsd's
# built-in blue and green until LS_COLORS is set. Source the LS_COLORS port
# alongside this one or the theme stops at the left margin.

user: "#fa99b4"
group: "#c9b0e8"

permission:
  read: "#b7e6b7"
  write: "#f0d6a0"
  # The rwx triad has to stay readable at a glance, so exec takes cherry rather
  # than ui.error: cranberry means "this failed", and every executable file in
  # the listing should not be shouting that.
  exec: "#e7aab5"
  exec-sticky: "#ecbcfc"
  no-access: "#a28297"
  octal: "#83d4db"
  acl: "#b0dfd9"
  context: "#9cc6ea"

attributes:
  archive: "#b7e6b7"
  read: "#f0d6a0"
  hidden: "#a28297"
  system: "#ecbcfc"

# Recency, cool and brightest first. The same shape catppuccin/lsd uses (teal, sky,
# sapphire): most rows are "older", so the column has to keep a colour of its own
# or the listing loses it. Cool against the warm size column beside it.
date:
  hour-old: "#b0dfd9"
  day-old: "#83d4db"
  older: "#9cc6ea"

size:
  none: "#a28297"
  small: "#b7e6b7"
  medium: "#f0d6a0"
  large: "#f7bf9e"

inode:
  valid: "#83d4db"
  invalid: "#a28297"

tree-edge: "#a28297"

links:
  valid: "#83d4db"
  invalid: "#a28297"

# Same meanings the starship port uses, so a dirty tree reads the same in both.
git-status:
  default: "#a28297"
  unmodified: "#a28297"
  ignored: "#a28297"
  new-in-index: "#b7e6b7"
  new-in-workdir: "#f0d6a0"
  typechange: "#ecbcfc"
  deleted: "#ff8a8a"
  renamed: "#c9b0e8"
  modified: "#f0d6a0"
  conflicted: "#ff8a8a"
