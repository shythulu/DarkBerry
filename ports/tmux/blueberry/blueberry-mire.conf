# vim:set ft=tmux:
# Blueberry Mire for tmux. Blueberry tint of Mire: dark, neutrals leaned toward blueberry (base #192237).
#
# Generated by build.mjs from src/ports/tmux.conf. Do not edit ports/tmux/.
# Install with:  cp blueberry-mire.conf ~/.config/tmux/
# then in ~/.config/tmux/tmux.conf (or ~/.tmux.conf):
#   source-file ~/.config/tmux/blueberry-mire.conf
# and reload with `tmux source-file ~/.config/tmux/tmux.conf`. Nothing needs renaming
# and there is no version to bump: tmux re-reads the file on every source-file.
# Needs tmux 3.2 or later: copy-mode-match-style and copy-mode-current-match-style
# arrived in 3.2. popup-style, popup-border-style, menu-style, menu-selected-style
# and menu-border-style (3.3 and 3.4) are set with -q, so an older tmux skips them
# silently instead of aborting the whole file.
# The colours are 24-bit, so tmux must know the outer terminal is truecolor, or it
# rounds them to the nearest of 256. If yours is not detected, add to tmux.conf:
#   set -as terminal-features ",xterm-256color:RGB"
# Sourcing this file sets no plugin, no key binding and no option other than the
# ones below; it is the whole theme.
#
# Layout. The status line is the tab strip (ui.pane.tertiary, as kitty's
# tab_bar_background). On it: the session name as a badge on the left (ui.on.fill on
# ui.fill), the window list, and a right-hand segment on ui.pane.secondary with the host
# in ui.text.muted and the clock in ui.text. The active window is filled with the tab
# indicator under ui.on.tab.indicator, exactly as kitty's active tab; inactive windows
# are ui.text.muted on ui.tab.inactive.
#
# Deliberately left unset:
#   window-style, window-active-style, cursor-colour, cursor-style, pane-colours: the
#     pane's own text, background and cursor come from the terminal (the kitty, Ghostty
#     or Konsole port), and painting them here would override that port and colour an
#     inactive pane differently from an active one.
#   window-status-last-style: the previous window needs no colour of its own.
#   status-left-style, status-right-style: both segments carry their colours inline.
#   pane-border-lines, pane-border-indicators, pane-border-status, status-position,
#     status-justify, window-status-separator: layout, not colour; keep your own.
#
# Host-owned pairings (the foreground on these fills is whatever the pane was showing,
# which this file cannot choose):
#   copy-mode-match-style (other search hits): ui.mark1 mixed 35% into ui.background.
#     ui.text on it: Wisp 6.3, Fen 4.7, Mire 6.2, Blackwater 6.8.
#   mode-style (the copy-mode selection) does set fg=ui.text, as kitty's
#     selection_foreground does. ui.text on ui.selection: Wisp 7.7, Fen 6.6, Mire 9.3,
#     Blackwater 10.6.
#   window-status-activity-style and window-status-bell-style keep the tab's surface
#     and colour the text with ui.info and ui.bell instead of filling the tab, so the
#     alert reads as a status colour, not as a second selected tab. ui.info on
#     ui.tab.inactive: Wisp 5.1, Fen 9.1, Mire 10.2, Blackwater 11.1; ui.bell: Wisp 5.1,
#     Fen 9.4, Mire 10.9, Blackwater 11.9.
#
# Differs from Catppuccin (catppuccin/tmux, main at b2dc412):
#   Catppuccin's status bar is mantle; here it is crust (ui.pane.tertiary), because
#     the line is a tab strip first, and kitty's strip is crust.
#   Catppuccin's current window is mauve (number) beside surface1 (name); here the whole
#     tab is the tint under ui.on.tab.indicator, as kitty.
#   Catppuccin fills an activity tab with lavender and a bell tab with yellow; here the
#     text turns ui.info or ui.bell on the tab's own surface (see above).
#   Catppuccin's messages are teal on overlay0; here ui.text on ui.pane.secondary, the
#     status-bar pairing.
#   Catppuccin's copy-mode selection is surface0 bold; here ui.selection, the text
#     selection every port shares.
#   Catppuccin's clock is blue; here tint, the accent as readable text.
#   Catppuccin leaves display-panes and the copy-mode search styles at tmux's
#     defaults (blue/red, cyan/magenta/red); here they are ui.text.muted/ui.accent and
#     the mark roles.
#   Catppuccin's menu selection is bold fg on overlay0; here ui.on.fill on ui.fill, the
#     row-selection pairing.
#   Catppuccin does not set status-left or status-right; the plugin leaves them to its
#     modules. This file sets a two-segment layout of its own.

# Status line: the tab strip.
set -g status-style "fg=#e0e7f6,bg=#0c1428"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#ffffff,bg=#be4c8d,bold] #S #[default] "
set -g status-right "#[fg=#bac1d0,bg=#111a2f] #h #[fg=#e0e7f6,bg=#111a2f] %H:%M "

# Windows (tabs). The formats carry no colour; the styles do, so activity and bell can
# replace them.
set -g window-status-format " #I #W#F "
set -g window-status-current-format " #I #W#F "
set -g window-status-style "fg=#bac1d0,bg=#111a2f"
set -g window-status-current-style "fg=#0c1428,bg=#87aafd,bold"
set -g window-status-activity-style "fg=#9ed0c4,bg=#111a2f,bold"
set -g window-status-bell-style "fg=#e8c98a,bg=#111a2f,bold"

# Panes.
set -g pane-border-style "fg=#7d879d"
set -g pane-active-border-style "fg=#be4c8d"

# Messages and the command prompt: the status-bar pairing.
set -g message-style "fg=#e0e7f6,bg=#111a2f"
set -g message-command-style "fg=#e0e7f6,bg=#111a2f"

# Copy mode: the selection is the shared text selection; search hits are marks.
set -g mode-style "fg=#e0e7f6,bg=#42324b"
set -g copy-mode-current-match-style "fg=#0c1428,bg=#baa8dc"
set -g copy-mode-match-style "bg=#3c3f5b"
set -g copy-mode-mark-style "fg=#0c1428,bg=#ddb0ec"

# The clock (prefix t) and the pane numbers (prefix q) are big text on the pane.
set -g clock-mode-colour "#87aafd"
set -g display-panes-colour "#bac1d0"
set -g display-panes-active-colour "#be4c8d"

# Popups and menus (tmux 3.3 and 3.4; -q lets older versions skip them). The border
# is a hairline inside the window: surface1, structural.
set -gq popup-style "fg=#e0e7f6,bg=#192237"
set -gq popup-border-style "fg=#253049"
set -gq menu-style "fg=#e0e7f6,bg=#192237"
set -gq menu-selected-style "fg=#ffffff,bg=#be4c8d"
set -gq menu-border-style "fg=#253049"
