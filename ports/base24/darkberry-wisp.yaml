# Darkberry Wisp as a Base24 scheme. Light. Text is a violet-leaning cousin of the paint colour.
#
# Generated by build.mjs from src/ports/base24.yaml. Do not edit ports/base24/.
# Drop the file into a Base24 builder's schemes directory -- tinty, or
# tinted-builder-rust -- and every Base24 template on the machine is built from
# it: terminals, editors, shells, compositors.
#
# Written against the Base24 styling spec 0.1.3 and the common scheme format in
# tinted-theming/home builder.md, which fixes the six keys below and allows hex
# with or without the leading hash.
#
# Base24 gives most slots two jobs at once -- a text-editor meaning and an ANSI
# code -- and the two do not always want the same colour. Where they disagree,
# this file follows the spec's own instruction to keep the slot legible, since
# that is the half Darkberry's build can measure.
#
# Three syntax meanings shift on the way in. Base24 pins variables to red,
# classes to yellow and functions to blue; Darkberry gives those meanings berry
# tones instead (see syntax.$why in roles.json) and keeps the hue slots for ANSI,
# so a terminal built from this file matches the kitty, Ghostty and Konsole ports
# exactly. Losing three syntax assignments is the cheaper half of that trade: the
# ANSI colours are what every other program on the machine reads.

system: "base24"
name: "Darkberry Wisp"
slug: "darkberry-wisp"
author: "Darkberry (https://shythulu.github.io/DarkBerry/)"
description: "Light. Text is a violet-leaning cousin of the paint colour."
variant: "light"

palette:
  # The neutral ramp, base00 to base07. The spec wants it running dark to light
  # on a dark theme and light to dark on a light one; Darkberry's palette already
  # flips per flavour, so the one mapping serves all four.
  #
  # base00 is ANSI 0: base24 ties terminal black to the editor background.
  # Darkberry's own terminal ports hold ansi.0 at surface1 instead, so that black
  # text stays visible, but base24 has no second slot to put that in.
  base00: "#fbf4f8"
  # base01 is the lighter background, which the spec also makes the current-line
  # colour and the backdrop it asks the category colours to stay legible against.
  # ui.line.current is the only role Darkberry measures for exactly that: the
  # build fails unless it holds 85% of every syntax role's own minimum contrast.
  # surface0, the obvious alternative, misses that bar on 13 of the 19 roles in
  # Wisp; ui.line.current misses none, in any flavour.
  base01: "#f1e6ed"
  # Selection, measured the same way at 65%.
  base02: "#f4cce0"
  # base03 is comments and invisibles, and ANSI 8. The spec asks for legibility
  # against base00, so it takes the comment role, which is contrast-checked at
  # 4.5:1, rather than ansi.8's surface grey, which lands between 1.4:1 and
  # 1.9:1 in the three dark flavours.
  base03: "#806776"
  # Status-bar foreground, and the spec's menu text.
  base04: "#694e5f"
  # Default foreground: caret, delimiters, operators. ANSI 7.
  base05: "#4f3143"
  # base06 is the light foreground. The spec spends it on search matches and on
  # the selected menu item, so it takes the colour Darkberry already uses to say
  # "you are here" rather than a near-white nothing.
  base06: "#b7437d"
  # base07 is ANSI 15, bright white, written as the terminal ports write it.
  # base06 already carries the light-foreground duty, so this slot goes to
  # terminals rather than to editors.
  base07: "#d0bac8"

  # The hues. These are Darkberry's ANSI colours, not its syntax roles; the
  # comment on each names the meaning base24 attaches to it.
  base08: "#cc3838"  # red: errors, diff deleted
  base09: "#b15423"  # orange, ANSI 16: integers, booleans, constants
  base0A: "#90670a"  # yellow: classes, markup bold
  base0B: "#377a37"  # green: strings, diff inserted
  base0C: "#1d7d6c"  # cyan: support, regex, escapes, quotes
  base0D: "#3b5fd0"  # blue: functions, methods, headings
  base0E: "#d21570"  # magenta: keywords, storage, markup italic
  base0F: "#a15873"  # dark red, ANSI 17: deprecated code, embedded tags

  # The two recessed backgrounds. Light flavours keep these recessed rather than
  # raised, as every scheme in the tinted-theming repository does and the spec's
  # light-theme ordering note notwithstanding: a light theme's panes still sit
  # below its page.
  base10: "#f3e6ef"
  base11: "#ebdae5"

  # The brights, following Catppuccin's formula as applied in lib/color.mjs.
  base12: "#d8473e"  # bright red
  base13: "#997317"  # bright yellow
  base14: "#3e8543"  # bright green
  base15: "#298878"  # bright cyan
  base16: "#5067da"  # bright blue
  base17: "#df2a76"  # bright magenta
