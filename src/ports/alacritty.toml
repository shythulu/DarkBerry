# %FULL% for Alacritty. %NOTE%
#
# Generated by build.mjs from src/ports/alacritty.toml. Do not edit ports/alacritty/.
# Install with:  cp %SLUG%.toml ~/.config/alacritty/themes/
# then import it from ~/.config/alacritty/alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/%SLUG%.toml"]
# Alacritty 0.13 wants `import = [...]` at the top of the file instead of under
# [general]; 0.14 and later accept both. Flatpak reads the same layout under
# ~/.var/app/org.alacritty.Alacritty/config/alacritty/, Windows under
# %APPDATA%\alacritty\. Alacritty reloads the file when it changes; nothing is
# renamed and no version is bumped.
#
# Needs Alacritty 0.13 or newer, the first release that reads TOML; older
# releases read alacritty.yml and ignore this file.
#
# ANSI 0 to 15 and the two indexed colours are the same mapping kitty, Ghostty
# and Konsole use. Alacritty also wants a dim variant of the eight normal
# colours, which Darkberry has no role for, so each one is mixed 40% toward the
# background, as Konsole's Faint set is. Bold text keeps its own colour
# (draw_bold_text_with_bright_colors stays at Alacritty's default, false), so
# bold is ui.text as it is in Konsole and kitty.
#
# Left unset: transparent_background_colors (an opacity switch, not a colour) and
# draw_bold_text_with_bright_colors (see above). Both keep Alacritty's defaults.
#
# Host-owned pairings: none. Every fill here has its foreground beside it.
# Pairings the build does not check, measured with lib/color.mjs contrast():
#   ui.text on the search-match tint (mix of ui.mark1 into ui.background at 35%):
#     Wisp 6.3:1, Fen 4.7:1, Mire 6.2:1, Blackwater 6.8:1.
#   ui.on.accent on ui.accent (the vi-mode cursor): Wisp 4.8:1, Fen 4.6:1,
#     Mire 4.6:1, Blackwater 4.8:1.
#   dim red on the background: 2.8 to 3.0:1 in every flavour; dim white is 1.5:1
#     on Wisp, faint on cream by design (the same rule as bright white there).
#
# Differs from Catppuccin:
#   dim_foreground is ui.text.muted (subtext0), not overlay1: overlay1 is never
#     body text in Darkberry (3.3:1 on Wisp), and Konsole's ForegroundFaint
#     already takes ui.text.muted.
#   The vi-mode cursor takes the accent under ui.on.accent, where Catppuccin
#     paints it lavender: lavender is Catppuccin's accent, and Darkberry's is jam.
#   Search matches other than the focused one are a tint of ui.mark1 into the
#     background under ui.text, not an opaque subtext0 under base; the focused
#     match is ui.mark1 under ui.mark.text, where Catppuccin uses green.
#   The footer bar (the search and vi-mode prompt) is a status bar: ui.text on
#     ui.pane.secondary, not base on subtext0.
#   Hint labels are two user marks, ui.mark2 for the label's first character and
#     ui.mark3 for the rest of it, under ui.mark.text; Catppuccin uses yellow and
#     subtext0 under base.
#   Selection is ui.selection under ui.text, not rosewater under base.
#   The dim set and line_indicator are set here; Catppuccin leaves both to
#     Alacritty's defaults.

[colors.primary]
background = "{ui.background}"
foreground = "{ui.text}"
dim_foreground = "{ui.text.muted}"
bright_foreground = "{ui.text}"

[colors.cursor]
text = "{ui.cursor.text}"
cursor = "{ui.cursor}"

[colors.vi_mode_cursor]
text = "{ui.on.accent}"
cursor = "{ui.accent}"

[colors.search.matches]
foreground = "{ui.text}"
background = "{mix(ui.background,ui.mark1,0.35)}"

[colors.search.focused_match]
foreground = "{ui.mark.text}"
background = "{ui.mark1}"

[colors.footer_bar]
foreground = "{ui.text}"
background = "{ui.pane.secondary}"

[colors.line_indicator]
foreground = "{ui.text}"
background = "{ui.pane.secondary}"

[colors.hints.start]
foreground = "{ui.mark.text}"
background = "{ui.mark2}"

[colors.hints.end]
foreground = "{ui.mark.text}"
background = "{ui.mark3}"

[colors.selection]
text = "{ui.text}"
background = "{ui.selection}"

[colors.normal]
black = "{ansi.0}"
red = "{ansi.1}"
green = "{ansi.2}"
yellow = "{ansi.3}"
blue = "{ansi.4}"
magenta = "{ansi.5}"
cyan = "{ansi.6}"
white = "{ansi.7}"

[colors.bright]
black = "{ansi.8}"
red = "{ansi.9}"
green = "{ansi.10}"
yellow = "{ansi.11}"
blue = "{ansi.12}"
magenta = "{ansi.13}"
cyan = "{ansi.14}"
white = "{ansi.15}"

[colors.dim]
black = "{mix(ansi.0,ui.background,0.4)}"
red = "{mix(ansi.1,ui.background,0.4)}"
green = "{mix(ansi.2,ui.background,0.4)}"
yellow = "{mix(ansi.3,ui.background,0.4)}"
blue = "{mix(ansi.4,ui.background,0.4)}"
magenta = "{mix(ansi.5,ui.background,0.4)}"
cyan = "{mix(ansi.6,ui.background,0.4)}"
white = "{mix(ansi.7,ui.background,0.4)}"

[[colors.indexed_colors]]
index = 16
color = "{terminal.color16}"

[[colors.indexed_colors]]
index = 17
color = "{terminal.color17}"
