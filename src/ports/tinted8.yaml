# %FULL% as a Tinted8 scheme. %NOTE%
#
# Generated by build.mjs from src/ports/tinted8.yaml. Do not edit ports/tinted8/.
# Drop the file into a Tinted8 builder's schemes directory and every Tinted8
# template on the machine is built from it.
#
# Written against the Tinted8 styling spec 0.2.0 (tinted-theming/home,
# specs/tinted8/styling.md) and checked against tinted-builder-rust 0.21.0,
# which is what actually reads it. Where the two disagree on a key's name, the
# builder wins -- see the note above the ui block. Tinted8 asks for eight anchor
# colours and derives
# everything else; a scheme that stops there gets a builder's guess at its
# backgrounds, its cursor and its syntax. Darkberry has measured answers for all
# of those, so this file declares them: the palette carries the terminal, the
# syntax and ui blocks carry the theme.
#
# Two spec notes worth keeping in mind when reading it:
#
#   - syntax keys inherit up the dotted chain, and setting an ancestor replaces
#     the builder defaults of every descendant, including ones whose default
#     differs. Everything below is therefore written at the level it means, and
#     a child that would otherwise be dragged along is set next to its parent:
#     string.regexp beside string is the clearest case, since the two default to
#     different colours. The key names are the builder's, not the spec's, here
#     too: it wants variable.other.property where the spec prints
#     variable.other.object.property.
#   - the dark and light segments of ui.global and ui.chrome name a surface's
#     role, not its luminance: dark is the recessed surface, light the raised
#     one. Darkberry's panes are recessed in all four flavours, so mantle and
#     crust take the dark half whether the flavour is light or not.

scheme:
  system: "tinted8"
  supports:
    styling-spec: "0.2.0"
  name: "%FULL%"
  slug: "%SLUG%"
  family: "%NAME%"
  style: "%FLAVOUR%"
  author: "%NAME% (%HOMEPAGE%)"
  description: "%NOTE%"
variant: "%SCHEME%"

# The eight required anchors are Darkberry's ANSI colours, written exactly as the
# kitty, Ghostty and Konsole ports write them, so a terminal built from this file
# matches the ones that ship. That means black is not the editor background and
# white is not the editor text: Darkberry keeps ANSI black off the background on
# purpose, so that black text stays visible. The editor's real background and
# text are declared as global.background.normal and global.foreground.normal
# below, which is where a Tinted8 builder looks for them.
palette:
  black: "{ansi.0}"
  red: "{ansi.1}"
  green: "{ansi.2}"
  yellow: "{ansi.3}"
  blue: "{ansi.4}"
  magenta: "{ansi.5}"
  cyan: "{ansi.6}"
  white: "{ansi.7}"
  # The brights follow Catppuccin's formula, applied in lib/color.mjs.
  black-bright: "{ansi.8}"
  red-bright: "{ansi.9}"
  green-bright: "{ansi.10}"
  yellow-bright: "{ansi.11}"
  blue-bright: "{ansi.12}"
  magenta-bright: "{ansi.13}"
  cyan-bright: "{ansi.14}"
  white-bright: "{ansi.15}"
  # Supplemental. The spec warns that a derived gray inherits a hue from the two
  # anchors and is not guaranteed to be neutral, and asks authors who care to set
  # it; Darkberry cares, and its comment colour is the grey it has already
  # measured at 4.5:1. Orange is the extended terminal colour 16.
  gray: "{syntax.comment}"
  orange: "{terminal.color16}"

# Syntax. Each key is the spec's own property name, flattened, as the schemes in
# the tinted-theming repository write them. Assignments match the VS Code port
# token for token, so the two never drift.
syntax:
  text: "{syntax.text}"
  comment: "{syntax.comment}"
  constant: "{syntax.constant}"
  constant.numeric: "{syntax.number}"
  constant.character.escape: "{syntax.number}"
  entity.name.class: "{syntax.type}"
  entity.name.function: "{syntax.function}"
  entity.name.namespace: "{syntax.namespace}"
  entity.name.section: "{syntax.function}"
  entity.name.tag: "{syntax.function}"
  entity.name.type: "{syntax.type}"
  entity.other.attribute-name: "{syntax.constant}"
  entity.other.inherited-class: "{syntax.type}"
  invalid: "{syntax.error}"
  invalid.deprecated: "{syntax.deprecated}"
  keyword: "{syntax.keyword}"
  keyword.operator: "{syntax.operator}"
  markup.bold: "{syntax.constant}"
  markup.changed: "{syntax.type}"
  markup.deleted: "{syntax.diff.removed}"
  markup.heading: "{syntax.function}"
  markup.inserted: "{syntax.string}"
  markup.italic: "{syntax.keyword}"
  markup.link: "{syntax.link}"
  markup.list: "{syntax.punctuation}"
  markup.quote: "{syntax.comment}"
  markup.raw: "{syntax.string}"
  punctuation: "{syntax.punctuation}"
  punctuation.definition.comment: "{syntax.comment}"
  punctuation.definition.string: "{syntax.string}"
  storage: "{syntax.keyword}"
  storage.type: "{syntax.type}"
  string: "{syntax.string}"
  # string.regexp defaults to red while string defaults to green, so setting
  # string alone would quietly drag the regex colour along with it.
  string.regexp: "{syntax.regex}"
  support.class: "{syntax.type}"
  support.constant: "{syntax.constant}"
  support.function: "{syntax.function}"
  support.type: "{syntax.type}"
  support.variable: "{syntax.variable}"
  variable: "{syntax.variable}"
  variable.language: "{syntax.variable}"
  variable.other.property: "{syntax.property}"
  variable.parameter: "{syntax.variable}"

# UI. These keys do not inherit -- each one falls back to a builder default on
# its own -- so every surface Darkberry has an opinion about is named here.
#
# The names below are the ones tinted-builder-rust 0.21.0 accepts, which are not
# always the ones the styling spec prints. The spec writes ui.chrome.normal.
# background and ui.highlight.text.active.background; the builder wants
# chrome.background.normal and highlight.text.active-background. Its scheme
# struct denies unknown fields, so a single name from the spec's spelling makes
# it reject the whole file -- the same trap lsd's theme struct sets, and the same
# answer: write what the reader accepts. Verified by building all four flavours
# with it.
ui:
  accent.normal: "{ui.accent}"
  border.normal: "{ui.border.inactive}"
  chrome.background.normal: "{ui.pane.secondary}"
  chrome.background.dark: "{ui.pane.tertiary}"
  chrome.background.light: "{ui.background}"
  chrome.foreground.normal: "{ui.text.muted}"
  chrome.foreground.dark: "{ui.text.subtle}"
  chrome.foreground.light: "{ui.text}"
  cursor.normal.background: "{ui.cursor}"
  cursor.normal.foreground: "{ui.cursor.text}"
  cursor.muted.background: "{ui.border.inactive}"
  cursor.muted.foreground: "{ui.background}"
  deprecated: "{syntax.deprecated}"
  global.background.normal: "{ui.background}"
  global.background.dark: "{ui.pane.secondary}"
  global.background.light: "{surface0}"
  global.foreground.normal: "{ui.text}"
  global.foreground.dark: "{ui.text.muted}"
  global.foreground.light: "{ui.text}"
  gutter.background: "{ui.pane.secondary}"
  gutter.foreground: "{ui.text.subtle}"
  highlight.button.background: "{ui.fill}"
  highlight.button.foreground: "{ui.on.fill}"
  # The one background in the theme built to be written on: the build fails
  # unless it holds 85% of every syntax role's own minimum contrast.
  highlight.line.background: "{ui.line.current}"
  highlight.line.foreground: "{ui.text.muted}"
  # The search pair is the mark family, the only fill in Darkberry whose text
  # colour is measured against it -- 4.5:1, enforced by minContrastWith.
  highlight.search.background: "{ui.mark1}"
  highlight.search.foreground: "{ui.mark.text}"
  highlight.text.background: "{ui.selection}"
  highlight.text.foreground: "{ui.text}"
  highlight.text.active-background: "{ui.selection}"
  highlight.text.active-foreground: "{ui.text}"
  indent-guide.background: "{mix(base,surface1,0.4)}"
  indent-guide.active-background: "{mix(surface2,overlay0,0.3)}"
  link.normal.foreground: "{ui.link}"
  selection.background: "{ui.selection}"
  selection.foreground: "{ui.text}"
  selection.inactive-background: "{mix(surface0,surface1,0.6)}"
  status.error: "{ui.error}"
  status.info: "{ui.info}"
  status.success: "{ui.success}"
  status.warning: "{ui.warning}"
  tooltip.background: "{mix(mantle,base,0.4)}"
  tooltip.foreground: "{ui.text.muted}"
  whitespace.foreground: "{surface2}"
