# Packages every port and attaches the files to a GitHub Release.
# Push a version tag (v0.3.0) to cut a release. Running it by hand from the Actions tab
# packages without releasing and leaves the files as build artifacts, which is the way to
# check a packaging change before tagging.
#
# Firefox is distributed through addons.mozilla.org as a listed add-on, so AMO signs and
# serves it and users get updates automatically. The .xpi files attached to the release are
# the unsigned build output, kept for archival only.
#
# The amo job submits each flavour as a new version. It stays skipped until AMO_JWT_ISSUER
# and AMO_JWT_SECRET exist as repository secrets, and it only handles UPDATES: the first
# submission of each of the four flavours has to be made once by hand on AMO, where you
# choose categories and upload preview images. See docs/AMO.md.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read the version
        id: meta
        run: echo "version=$(node -p "require('./src/palette.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches src/palette.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want='${{ steps.meta.outputs.version }}'
          got="${GITHUB_REF_NAME#v}"
          test "$got" = "$want" ||
            { echo "::error::tag $GITHUB_REF_NAME does not match version $want in src/palette.json"; exit 1; }

      - name: Check the committed ports are current
        run: |
          node build.mjs
          git diff --exit-code -- ports ||
            { echo "::error::ports/ is stale; run node build.mjs and commit the result"; exit 1; }

      - name: Package
        run: ./package.sh

      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version='${{ steps.meta.outputs.version }}'
          {
            echo "### Install"
            echo
            echo "**VS Code** (and Cursor, VSCodium, Windsurf) — \`code --install-extension darkberry-theme-$version.vsix\`, or Extensions > ... > Install from VSIX. Pick a flavour with Ctrl+K Ctrl+T."
            echo
            echo "**kitty** — unzip \`darkberry-kitty-$version.zip\` into \`~/.config/kitty/themes/\`, then \`kitty +kitten themes\`."
            echo
            echo "**Ghostty** — unzip \`darkberry-ghostty-$version.zip\` into \`~/.config/ghostty/themes/\`, keeping the file names, then set \`theme = light:Darkberry Wisp,dark:Darkberry Mire\`."
            echo
            echo "**Obsidian** — unzip \`darkberry-obsidian-$version.zip\` into your vault's \`.obsidian/themes/\`, then pick a flavour under Settings > Appearance > Themes."
            echo
            echo "**KDE Plasma** — unzip \`darkberry-kde-$version.zip\` into \`~/.local/share/color-schemes/\`, then pick a flavour in System Settings > Colors."
            echo
            echo "**Konsole** — unzip \`darkberry-konsole-$version.zip\` into \`~/.local/share/konsole/\`, then Settings > Edit Current Profile > Appearance."
            echo
            echo "**Firefox** — install from [addons.mozilla.org](https://addons.mozilla.org/firefox/search/?q=darkberry), which is where updates come from. The \`.xpi\` files attached here are the unsigned build output, kept for archival: release Firefox refuses unsigned add-ons, so they install only through \`about:debugging\` > Load Temporary Add-on, or on Developer Edition, Nightly or an unbranded Release/Beta build with \`xpinstall.signatures.required\` set to \`false\`."
          } > notes.md

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Darkberry $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*.vsix dist/*.xpi dist/*.zip dist/palette.json

      - name: Upload the files as artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: darkberry-${{ steps.meta.outputs.version }}
          path: |
            dist/*.vsix
            dist/*.xpi
            dist/*.zip

  # Separate job on purpose: the release must not depend on AMO being up or quick.
  amo:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit each flavour to addons.mozilla.org
        if: env.AMO_JWT_ISSUER != ''
        run: |
          # --channel listed adds a version to an existing listing. AMO publishes the signed
          # file itself, so there is nothing to wait for or bring back: a short approval
          # timeout keeps four submissions from holding the runner for an hour.
          fail=0
          for dir in ports/firefox/*/; do
            flavour=$(basename "$dir")
            echo "::group::$flavour"
            npx --yes web-ext sign --source-dir "$dir" --channel listed \
              --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
              --approval-timeout 0 || { echo "::error::AMO submission failed for $flavour"; fail=1; }
            echo "::endgroup::"
          done
          test "$fail" -eq 0 ||
            { echo "::error::The release published; only the AMO submission failed. Re-run this job once fixed."; exit 1; }
